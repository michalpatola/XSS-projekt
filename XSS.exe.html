<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>XSS.exe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: scena 1280×720 skalowana do okna; każdy slajd to jedno okno XP: pasek tytułu, treść w siatce paneli, pasek stanu */
:root{
  --desk:#C9D3E2; --bg:#F4F6FA; --panel:#FFFFFF; --face:#ECE9D8; --line:#A9BCD8; --frame:#7F9DB9;
  --ink:#18202E; --muted:#475366; --navy:#0A246A; --blue:#245EDC; --sel:#316AC5; --soft:#EAF1FC;
  --ok:#237A23; --okbg:#E6F5E2; --err:#B8331A; --errbg:#FCE9E4; --warnbg:#FFF5D1; --balloon:#FFFFE1;
  --ui:Tahoma,Verdana,"DejaVu Sans",sans-serif;
  --head:"Trebuchet MS",Tahoma,Verdana,"DejaVu Sans",sans-serif;
  --mono:"Lucida Console",Consolas,"DejaVu Sans Mono","Courier New",monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--desk);color:var(--ink);font-family:var(--ui);box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view{position:relative;width:100%;height:100%}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;overflow:hidden;transform-origin:50% 50%;background:var(--bg);box-shadow:0 6px 30px rgba(10,36,106,.25);border:3px solid #0831D9;border-top:0;border-radius:10px 10px 0 0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
.ic{width:24px;height:24px;flex:none;display:inline-block;vertical-align:middle}
.mono{font-family:var(--mono)}

/* pasek tytułu */
.hdr{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 8px 0 16px;background:linear-gradient(180deg,#0997FF 0%,#0053EE 9%,#0050EE 18%,#0066FF 72%,#0060F8 88%,#003DD7 100%);color:#fff;font:bold 18px var(--head);text-shadow:1px 1px #0F1089;border-radius:8px 8px 0 0}
.hdr .ic{width:24px;height:24px}
.hdr .ht{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ht em{font-style:normal;font-weight:normal;opacity:.85}
.tbtn{width:27px;height:27px;border:1px solid #fff;border-radius:4px;background:linear-gradient(135deg,#6FA8FF,#2565E8 55%,#1D5BE0);position:relative;flex:none}
.tbtn.x{background:linear-gradient(135deg,#F5A58C,#E0441C 55%,#C7300B)}
.tbtn.mn::after{content:"";position:absolute;left:6px;width:9px;bottom:6px;height:3px;background:#fff}
.tbtn.mx::after{content:"";position:absolute;inset:5px;border:2px solid #fff;border-top-width:4px}
.tbtn.x::before,.tbtn.x::after{content:"";position:absolute;left:11.5px;top:4px;width:2.5px;height:17px;background:#fff;transform:rotate(45deg)}
.tbtn.x::after{transform:rotate(-45deg)}

/* pasek stanu */
.sb{position:absolute;left:0;right:0;bottom:0;height:34px;display:flex;background:var(--face);border-top:1px solid #fff;box-shadow:0 -1px 0 #ACA899;font-size:15px;color:#333}
.sb>div{display:flex;align-items:center;gap:8px;padding:0 14px;border-right:1px solid #ACA899;box-shadow:1px 0 0 #fff;white-space:nowrap}
.sb .ic{width:18px;height:18px}
.sb .grow{flex:1}
.sb .num{font-variant-numeric:tabular-nums;min-width:96px;justify-content:center}
.segs{display:flex;gap:2px;padding:2px;border:1px solid var(--frame);background:#fff;height:14px}
.segs i{width:9px;background:#E1E6EE}
.segs i.on{background:linear-gradient(180deg,#ACEDAD,#2EB82E 45%,#1E9E1E)}

/* strona */
.page{position:absolute;left:0;right:0;top:46px;bottom:34px;padding:24px 42px 24px;display:flex;flex-direction:column;gap:10px}
.page.fade{animation:fade .25s ease-out}
@keyframes fade{from{opacity:0}}
.page h2{margin:0;font:bold 38px/1.1 var(--head);color:var(--navy);text-wrap:balance}
.lead{margin:0 0 6px;font-size:21px;color:var(--muted);line-height:1.4;max-width:70ch}
.body{flex:1;min-height:0;display:grid;gap:22px}
.c2{grid-template-columns:1fr 1fr}
.c3{grid-template-columns:repeat(3,1fr)}
.c4{grid-template-columns:repeat(4,1fr)}
.c64{grid-template-columns:1.35fr 1fr}
.c46{grid-template-columns:1fr 1.35fr}
.g32{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr}
.g22{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.stack{display:flex;flex-direction:column;gap:16px;min-height:0;min-width:0}
.stack>.grow{flex:1}

/* panele */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 6px rgba(20,40,90,.08);padding:18px 22px;display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.panel.ctr{justify-content:center}
.panel.soft{background:var(--soft);border-color:#C3D3EE}
.panel.ok{background:var(--okbg);border-color:#A9D3A0}
.panel.bad{background:var(--errbg);border-color:#E7B1A3}
.panel.warn{background:var(--warnbg);border-color:#E3CF84}
.ph{display:flex;align-items:center;gap:10px;font:bold 22px/1.2 var(--head);color:var(--navy)}
.ph .ic{width:34px;height:34px}
.ph small{margin-left:auto;font:bold 15px var(--ui);color:#7a869a;letter-spacing:.06em}
.panel p{margin:0;font-size:19px;line-height:1.45}
.panel p.m{color:var(--muted)}
.bl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:12px;flex:1}
.bl li{display:flex;gap:14px;align-items:flex-start}
.bl .ic{width:38px;height:38px;margin-top:2px}
.bl b{display:block;font:bold 22px/1.25 var(--head);color:var(--navy);margin-bottom:3px}
.bl span{display:block;font-size:19px;line-height:1.4;color:var(--muted)}
code,.cd{font-family:var(--mono);font-size:.9em;background:#EEF2F9;border:1px solid #D3DCEB;border-radius:3px;padding:0 5px;color:#1d2b4a;white-space:nowrap}
.arrow{display:flex;align-items:center;justify-content:center;font:bold 34px var(--ui);color:var(--blue)}
.cap{font-size:15px;color:#6b7587;text-align:center}

/* mini okna XP */
.mw{border:2px solid #0831D9;border-top:0;border-radius:6px 6px 0 0;background:#fff;display:flex;flex-direction:column;box-shadow:1px 2px 6px rgba(0,0,0,.18);min-width:0}
.mwt{height:28px;flex:none;display:flex;align-items:center;gap:6px;padding:0 4px 0 8px;margin:0 -2px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#0997FF 0%,#0053EE 10%,#0066FF 75%,#003DD7 100%);color:#fff;font:bold 14px var(--head);text-shadow:1px 1px #0F1089}
.mwt .ic{width:16px;height:16px}
.mwt span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mwt i{width:19px;height:19px;border:1px solid #fff;border-radius:3px;background:linear-gradient(135deg,#F5A58C,#E0441C 55%,#C7300B);position:relative;flex:none}
.mwt i::before,.mwt i::after{content:"";position:absolute;left:8px;top:2px;width:2px;height:13px;background:#fff;transform:rotate(45deg)}
.mwt i::after{transform:rotate(-45deg)}
.maddr{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--face);border-bottom:1px solid #ACA899;font:15px var(--mono);color:#222;white-space:nowrap;overflow:hidden}
.maddr::before{content:"Adres";font:13px var(--ui);color:#666;margin-right:2px}
.maddr .ic{width:15px;height:15px}
.mwb{padding:12px 14px;font-size:17px;flex:1;min-height:0}
.mwb.face{background:var(--face)}
.mwb.np{font:18px/1.5 var(--mono);white-space:pre}
.dm{display:flex;align-items:center;gap:12px;font-size:17px;line-height:1.35}
.dm .ic{width:34px;height:34px}
.dbs{display:flex;justify-content:center;gap:8px;margin-top:10px}
.xpb{display:inline-flex;align-items:center;justify-content:center;min-width:76px;padding:3px 12px;font:14px var(--ui);color:#000;background:linear-gradient(180deg,#fff,#ECEBE6 86%,#D6D0C5);border:1px solid #003C74;border-radius:3px;white-space:nowrap}
.lv{width:100%;border-collapse:collapse;font-size:17px}
.lv th{font:13px var(--ui);text-align:left;padding:4px 10px;background:#EBEADB;border-bottom:1px solid #ACA899;border-right:1px solid #D0CFC1;color:#333}
.lv td{padding:5px 10px}
.lv td .ic{width:18px;height:18px;margin-right:6px}
.lv tr.hl td{background:var(--sel);color:#fff;font-weight:bold}

/* liczby */
.tile{align-items:center;justify-content:center;text-align:center;gap:10px}
.tile .unit{font:bold 22px var(--head);color:var(--muted);letter-spacing:.08em;margin-top:-4px}
.tile .big{white-space:nowrap;font:bold 54px/1 var(--head);color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .big.r{color:var(--err)}
.tile p{font-size:18px;color:var(--muted)}
.tile .ic{width:44px;height:44px}
.src{font-size:15px;color:#6b7587}

/* tabele */
.tbl{width:100%;height:100%;border-collapse:collapse;background:#fff;font-size:19px}
.tbl th{font:bold 15px var(--ui);text-align:left;padding:8px 14px;background:#EBEADB;border-bottom:1px solid #ACA899;border-right:1px solid #D0CFC1;color:#333}
.tbl td{padding:10px 14px;border-bottom:1px solid #E4E8EF;vertical-align:middle;line-height:1.35}
.tbl td:first-child{font:bold 20px var(--head);color:var(--navy);white-space:nowrap}
.tbl td:first-child .ic{width:30px;height:30px;margin-right:8px}
.tblw{border:1px solid var(--frame);border-radius:4px;overflow:hidden;background:#fff;flex:1;min-height:0;display:flex}
.mini{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--frame);background:#fff}
.mini i{width:13px;height:13px;background:#E1E6EE}
.mini i.on{background:linear-gradient(180deg,#ACEDAD,#2EB82E 45%,#1E9E1E)}
.mini.r i.on{background:linear-gradient(180deg,#f7b1a0,#E0441C 45%,#b52f0f)}

/* kod */
.code{background:#fff;border:1px solid var(--frame);font:18px/1.65 var(--mono);padding:10px 14px;white-space:pre;overflow:hidden}
.code .c{color:#237A23}
.code .x{background:#FCE0D9;text-decoration:underline wavy var(--err);text-underline-offset:5px}
.code .y{background:#DDF3D8}
.codeh{display:flex;align-items:center;gap:8px;font:bold 17px var(--head);padding:6px 10px;color:#fff;border-radius:4px 4px 0 0}
.codeh.bad{background:var(--err)}
.codeh.good{background:#2E8E2E}
.term{background:#000;color:#C8C8C8;font:16px/1.6 var(--mono);padding:10px 12px;white-space:pre-wrap;border:2px solid #0831D9;border-top:0}

/* elementy specjalne */
.t1{justify-content:center;gap:14px}
.t1k{font:bold 15px var(--ui);color:#6b7587;text-transform:uppercase;letter-spacing:.14em}
.t1 h1{margin:0;font:bold 104px/1 var(--head);color:var(--navy);letter-spacing:-.02em}
.t1 h1 b{color:var(--err)}
.t1 h3{margin:0;font:28px var(--ui);color:#333}
.t1 p{font-size:20px;color:var(--muted);max-width:30ch}
.who{display:flex;align-items:center;gap:12px;font-size:22px;padding-top:16px;border-top:1px solid #D6DCE6;margin-top:8px}
.who .ic{width:34px;height:34px}
.authors{display:flex;flex-direction:column;gap:8px}
.authors span{display:flex;align-items:center;gap:12px}
.cardn{font:bold 15px var(--mono);color:#7a869a}
.bigl{font:bold 92px/1 var(--head);color:var(--navy)}
.bigl b{color:var(--err)}
.wall{width:46px;border:2px solid #5a2a14;background-color:#a8502a;background-image:linear-gradient(#5a2a14 2px,transparent 2px),linear-gradient(90deg,#5a2a14 2px,transparent 2px);background-size:100% 22px,46px 22px;border-radius:2px}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:stretch}
.step{align-items:center;text-align:center;justify-content:center}
.step>.ic{width:84px;height:84px}
.step .no{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;font:bold 20px var(--ui);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #CFE0FB}
.flowv{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;justify-content:space-evenly}
.node{display:flex;align-items:center;gap:12px;padding:10px 16px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:18px;width:100%;box-sizing:border-box}
.node .ic{width:36px;height:36px}
.node.bad{background:var(--errbg);border-color:#E7B1A3}
.down{font:bold 24px var(--ui);color:var(--blue);line-height:1}
.users{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;width:100%}
.users .ic{width:100%;height:auto;aspect-ratio:1}
.tree p{margin:0;padding:3px 6px;display:flex;align-items:center;gap:8px;font:17px var(--mono)}
.tree .ic{width:22px;height:22px}
.tree .l1{margin-left:28px}.tree .l2{margin-left:56px}
.tree .hl{background:var(--errbg);outline:2px solid var(--err)}
.srcl{display:grid;grid-template-columns:1fr 1fr;gap:26px 10px;margin-top:8px}
.srcl div,.snkl div{display:flex;align-items:center;gap:10px;font-size:18px}
.srcl .ic,.snkl .ic{width:36px;height:36px}
.snkl{display:flex;flex-direction:column;gap:24px;margin-top:8px}
.q{font:bold 22px/1.3 var(--head);color:var(--navy);text-align:center}
.bsod{background:#0000AA;color:#fff;font:17px/1.5 var(--mono);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.bsod b{background:#fff;color:#0000AA;padding:0 6px;align-self:flex-start}
.prof{display:flex;gap:16px;align-items:center}
.prof .av{width:90px;height:90px;border:2px solid #333;background:#d9e4f5;display:flex;align-items:center;justify-content:center}
.prof .av .ic{width:70px;height:70px}
.prof h4{margin:0;font:bold 26px var(--head);color:#003399}
.psec{border:1px solid #6699CC;margin-top:10px}
.psec div{background:#6699CC;color:#fff;font:bold 14px var(--ui);padding:3px 10px}
.psec p{margin:0;padding:8px 10px;font-size:18px;color:#C00;font-weight:bold}
.tw{border:1px solid #d3d9e2;border-left:4px solid var(--err);background:#fff;padding:10px 12px;font-size:16px}
.twh{display:flex;align-items:center;gap:6px}
.twh .ic{width:22px;height:22px}
.twh small{margin-left:auto;color:#888}
.tw p{margin:6px 0;font:17px var(--mono)}
.tw .f{font-size:15px;color:#444}
.layers{display:flex;flex-direction:column;gap:8px;flex:1;justify-content:space-evenly}
.layer{display:flex;align-items:center;gap:12px;padding:9px 14px;border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:4px;background:#fff;font-size:18px}
.layer b{font:bold 18px var(--head);color:var(--navy);min-width:28px}
.layer .ic{width:28px;height:28px;margin-left:auto}
.numc .no{font:bold 46px/1 var(--head);color:var(--blue)}
.chk{width:15px;height:15px;border:1px solid #1C5180;background:linear-gradient(135deg,#DCDCD7,#fff);display:inline-block;position:relative;flex:none}
.chk.on::after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid #21A121;border-width:0 3px 3px 0;transform:rotate(40deg)}
.ckl{display:flex;flex-direction:column;gap:8px}
.ckl div{display:flex;align-items:center;gap:10px;font-size:17px}
.fld{background:#fff;border:1px solid var(--frame);padding:4px 8px;font-size:17px;min-height:22px}
.bal{position:relative;background:var(--balloon);border:1px solid #000;border-radius:7px;padding:8px 12px;font-size:15px;box-shadow:1px 2px 5px rgba(0,0,0,.25)}
.bal::after{content:"";position:absolute;left:24px;top:-8px;width:14px;height:14px;background:var(--balloon);border-left:1px solid #000;border-top:1px solid #000;transform:rotate(45deg)}
.sd{display:flex;align-items:center;gap:14px;font-size:20px}
.sd i{width:52px;height:52px;border-radius:10px;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font:bold 26px var(--ui);font-style:normal;color:#fff;flex:none;box-shadow:0 0 0 1px #9aaccc,inset 0 -5px 8px rgba(0,0,0,.2)}
.sd .y{background:linear-gradient(180deg,#FFD84D,#E0A800)}
.sd .r{background:linear-gradient(180deg,#F5875F,#D9380E)}
.sd .g{background:linear-gradient(180deg,#7BD86A,#2F9E2F)}
.sd b{display:block;font:bold 24px var(--head);color:var(--navy)}
.sd span{display:block;font-size:18px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){.page.fade{animation:none}}
</style>

<div id="view"><div id="stage" role="region" aria-label="Prezentacja XSS"></div></div>

<script>
"use strict";
const sv=b=>`<svg viewBox="0 0 32 32" class="ic" aria-hidden="true">${b}</svg>`;
const folderC=(a,b,c)=>sv(`<path d="M2 7h10l3 3h15v18H2z" fill="${a}" stroke="${c}"/><path d="M2 12h28v16H2z" fill="${b}" stroke="${c}"/>`);
const docC=(f,l)=>sv(`<path d="M7 3h13l6 6v20H7z" fill="${f}" stroke="#6b7a96"/><path d="M20 3v6h6" fill="#dfe6f2" stroke="#6b7a96"/><path d="M10 14h12M10 18h12M10 22h9" stroke="${l}" stroke-width="1.6"/>`);

const ICON={
 folder:folderC('#E8B832','#F8D775','#B8860B'), folderRed:folderC('#C9311B','#F0705A','#7a1a0c'),
 doc:docC('#fff','#9aa9c2'), docG:docC('#E3F7DD','#2EB82E'), docR:docC('#FFE0D8','#E0441C'),
 xss:sv(`<path d="M7 3h13l6 6v20H7z" fill="#fff" stroke="#6b7a96"/><path d="M20 3v6h6" fill="#dfe6f2" stroke="#6b7a96"/><text x="16.5" y="22" font-size="10" font-family="monospace" text-anchor="middle" fill="#d22" font-weight="bold">&lt;/&gt;</text>`),
 comp:sv(`<rect x="4" y="4" width="24" height="18" rx="2" fill="#d9dde4" stroke="#6b7280"/><rect x="7" y="7" width="18" height="12" fill="#3b78d8"/><path d="M7 16l6-4 5 3 7-4v8H7z" fill="#5fa83a"/><path d="M11 26h10l2 3H9z" fill="#c4c9d2" stroke="#6b7280"/>`),
 db:sv(`<path d="M5 7v18c0 2.2 4.9 4 11 4s11-1.8 11-4V7" fill="#6f8fc4" stroke="#3d5a8a"/><path d="M5 13c0 2.2 4.9 4 11 4s11-1.8 11-4M5 19c0 2.2 4.9 4 11 4s11-1.8 11-4" fill="none" stroke="#3d5a8a"/><ellipse cx="16" cy="7" rx="11" ry="4" fill="#bcd0ee" stroke="#3d5a8a"/>`),
 server:sv(`<rect x="8" y="2" width="16" height="28" rx="2" fill="#cfd3da" stroke="#4b5363"/><path d="M11 6h10M11 9h10M11 12h10" stroke="#4b5363"/><circle cx="12" cy="24" r="1.7" fill="#2c2"/><circle cx="17" cy="24" r="1.7" fill="#fb3"/>`),
 cookie:sv(`<circle cx="16" cy="16" r="12" fill="#d8a35c" stroke="#8a5a22"/><circle cx="11" cy="12" r="2" fill="#5a3410"/><circle cx="19" cy="10" r="1.6" fill="#5a3410"/><circle cx="20" cy="19" r="2.2" fill="#5a3410"/><circle cx="12" cy="20" r="1.5" fill="#5a3410"/>`),
 bug:sv(`<path d="M16 10v18M9 14l-6-3M23 14l6-3M9 19H2M23 19h7M9 24l-6 3M23 24l6 3M14 5l-3-3M18 5l3-3" stroke="#222" stroke-width="1.8"/><ellipse cx="16" cy="18" rx="7" ry="9" fill="#c0262d" stroke="#5a0a0d"/><path d="M16 10v17" stroke="#5a0a0d"/><circle cx="16" cy="8" r="4" fill="#2b2b2b"/><circle cx="13" cy="16" r="1.6" fill="#2b2b2b"/><circle cx="19" cy="21" r="1.6" fill="#2b2b2b"/>`),

  const s=SL[cur];
  const head=s.h?`<h2>${s.h}</h2><p class="lead">${s.lead}</p>`:'';
  ST.innerHTML=`<div class="hdr">${ICON.xss}<span class="ht">XSS.exe <em>— ${SECS[s.sec]}</em></span><i class="tbtn mn"></i><i class="tbtn mx"></i><i class="tbtn x"></i></div>
  <div class="page${RM?'':' fade'}">${head}<div class="body ${s.cls||''}">${s.body}</div></div>
  <div class="sb"><div>${ICON[SECIC[s.sec]]}${SECS[s.sec]}</div><div class="grow">${s.title}</div><div><span class="segs">${SL.map((_,i)=>`<i class="${i<=cur?'on':''}"></i>`).join('')}</span></div><div class="num">Slajd ${cur+1}/${SL.length}</div></div>`;
  try{ history.replaceState(null,'','#s'+(cur+1)); }catch(e){}
}
function go(i){ if(i<0||i>=SL.length) return; cur=i; render(); }
function next(){ go(cur+1); }
function prev(){ go(cur-1); }

/* ---------- skalowanie i sterowanie ---------- */
function fit(){ const v=document.getElementById('view'); const W=v.clientWidth,H=v.clientHeight; scale=Math.min(W/1280,H/720); ST.style.transform=`translate(-50%,-50%) scale(${scale})`; ST.style.top=(H/2)+'px'; }
addEventListener('resize',fit);
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return; const k=e.key;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)){ e.preventDefault(); next(); }
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){ e.preventDefault(); prev(); }
});
ST.addEventListener('click',e=>{ const r=ST.getBoundingClientRect(); if(e.clientX-r.left<r.width*0.25) prev(); else next(); });
let tx0=null; ST.addEventListener('touchstart',e=>{ tx0=e.touches[0].clientX; },{passive:true});
ST.addEventListener('touchend',e=>{ if(tx0==null) return; const dx=e.changedTouches[0].clientX-tx0; tx0=null; if(Math.abs(dx)>50){ e.preventDefault(); dx<0?next():prev(); } });
fit();
{ const m=/^#s(\d+)$/.exec(location.hash); go(m?Math.min(SL.length-1,Math.max(0,+m[1]-1)):0); }
</script>

</body></html>
