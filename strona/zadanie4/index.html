<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberForum – Komentarze (Zadanie 4 - trudniejsze)</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="variant-2">
  <div class="container">
    <header class="header">
      <div class="header-top">
        <a href="../index.html" class="back-link">&larr; Powrót do menu</a>
        <span class="badge badge-v2">Zadanie 4 &bull; trudniejsze</span>
      </div>
      <h1>CyberForum – Dyskusja na żywo</h1>
      <p>Społecznościowy feed komentarzy i spostrzeżeń laboratoryjnych.</p>
    </header>

    <main class="card">
      <form id="comment-form">
        <div class="form-group">
          <label for="author-input">Użytkownik</label>
          <input type="text" id="author-input" name="author" class="input-text" placeholder="Twój identyfikator / nick...">
        </div>

        <div class="form-group">
          <label for="comment-input">Wiadomość</label>
          <textarea id="comment-input" name="comment" class="textarea" placeholder="Napisz wiadomość na tablicy..."></textarea>
        </div>

        <button type="submit" id="submit-comment" class="btn">Opublikuj wiadomość</button>
      </form>

      <section class="comments-section">
        <h2 class="comments-header">Komentarze społeczności</h2>
        <div id="comments-container" class="comments-list">
          <!-- Komentarze z localStorage będą wstawiane tutaj przez JavaScript -->
        </div>
      </section>
    </main>
  </div>
</body>
</html>
